name: 육아 뉴스 수집

on:
  schedule:
    - cron: '7,37 * * * *'   # 30분마다 (매시 07분·37분, 정각 혼잡 회피)
  workflow_dispatch:         # GitHub 앱/웹에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 뉴스 수집 (API 키 불필요)
        run: node scripts/fetch-news.mjs

      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- data/news.json; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "kids-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: 육아 뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
